<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>devTools storage</title></head>
<body>
<script>
var NS = "__devToolsScripts";

window.addEventListener("message", function(e) {
  var d = e.data;
  if (!d || d.ns !== NS || !d.id) return;

  var reply = { ns: NS, id: d.id };

  if (d.action === "get") {
    reply.value = localStorage.getItem(d.key) || "[]";
  } else if (d.action === "set") {
    try { localStorage.setItem(d.key, d.value); reply.ok = true; }
    catch(err) { reply.error = err.message; }
  }

  e.source.postMessage(reply, e.origin);
});
</script>
</body>
</html>
